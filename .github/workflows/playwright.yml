name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Future-proof : on force les actions JS à tourner sur Node 24
# (Node 20 sera retiré des runners GitHub en septembre 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke API tests
        env:
          # smoke-api consomme une URL publique + une publishable key.
          # Pas un secret par essence → OK en clair dans le YAML.
          # Les VRAIES secrets (creds, webhooks) arrivent en M9.L3.
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
        run: npx playwright test --project=smoke-api