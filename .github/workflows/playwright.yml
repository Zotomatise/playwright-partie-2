name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke API tests
        env:
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
        run: npx playwright test --project=smoke-api --shard=${{ matrix.shard }}/4

      # SMOKE CHROME (E2E UI) — login UI via global-setup
      # Les credentials de test viennent des GitHub Secrets (M9.L3).
      - name: Run smoke E2E tests (Chrome)
        env:
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
          ZOTOSHOP_TEST_EMAIL: ${{ secrets.ZOTOSHOP_TEST_EMAIL }}
          ZOTOSHOP_TEST_PASSWORD: ${{ secrets.ZOTOSHOP_TEST_PASSWORD }}
        run: npx playwright test --project=smoke-chrome --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      # 📊 Artefact bonus pour Allure (consommé par le job allure-deploy-real)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # MERGE-REPORTS — fusionne les blobs (HTML) + génère Allure + pousse les 2 dashboards
  # en UN SEUL commit gh-pages (évite les pages-build cancelled = point d'exclamation jaune)
  # Nom conservé pour rester compatible avec le required check `merge-reports` (M9.L5)
  merge-reports:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 1) HTML Playwright ────────────────────────────────────────────────
      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      # ── 2) Allure ──────────────────────────────────────────────────────────
      - name: Download allure-results from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      # ── 3) Combiner les 2 dashboards dans un seul dossier `site/` ────────
      - name: Prepare combined site (HTML at root + Allure in /allure/)
        run: |
          mkdir -p site
          cp -r playwright-report/* site/
          mkdir -p site/allure
          cp -r allure-report/* site/allure/

      # ── 4) UN SEUL push sur gh-pages → UN SEUL pages-build → zéro jaune ──
      - name: Deploy combined site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: Add dashboard URLs to summary
        run: |
          echo "## Dashboards live" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- HTML : https://zotomatise.github.io/playwright-partie-2/" >> $GITHUB_STEP_SUMMARY
          echo "- Allure : https://zotomatise.github.io/playwright-partie-2/allure/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Mis à jour automatiquement à chaque run._" >> $GITHUB_STEP_SUMMARY
