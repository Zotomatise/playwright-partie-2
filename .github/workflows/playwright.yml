name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # On veut voir tous les résultats même si un projet échoue
      matrix:
        shard: [1, 2, 3, 4]
        # 2 projets Playwright : smoke-api (tests API) + smoke-chrome (E2E UI)
        project: [smoke-api, smoke-chrome]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke API tests
        env:
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
        run: npx playwright test --project=smoke-api --shard=${{ matrix.shard }}/4

      # SMOKE CHROME (E2E UI) — login UI via global-setup
      # Les credentials de test viennent des GitHub Secrets (M9.L3).
      - name: Run smoke E2E tests (Chrome)
        env:
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
          ZOTOSHOP_TEST_EMAIL: ${{ secrets.ZOTOSHOP_TEST_EMAIL }}
          ZOTOSHOP_TEST_PASSWORD: ${{ secrets.ZOTOSHOP_TEST_PASSWORD }}
        run: npx playwright test --project=smoke-chrome --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-results-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: blob-results/
          retention-days: 1

      # 📊 Artefact bonus pour Allure (consommé par le job allure-deploy-real)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # 🌐 PAGES DEPLOY — publie le rapport Playwright HTML sur GitHub Pages
  # Dashboard public mis à jour à chaque run, accessible via une URL stable.
  merge-reports:
    # On déploie même si des tests ont échoué (sinon on ne verrait jamais les rapports rouges)
    if: always()
    # On attend que le job test (smoke-api + smoke-chrome) soit fini
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Droits d'écriture nécessaires pour pousser sur la branche gh-pages
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Télécharge tous les artefacts blob-results
      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: blob-results-*
          path: all-blob-reports
          merge-multiple: true

      # Vérifier que les artefacts ont été téléchargés
      - name: Check downloaded artifacts
        run: |
          echo "Contents of all-blob-reports:"
          ls -la all-blob-reports/ || echo "Directory all-blob-reports does not exist"

      # Fusionne les rapports blob en un seul rapport HTML
      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      # Pousse le dossier playwright-report/ sur la branche gh-pages
      # peaceiris/actions-gh-pages crée la branche au 1er run, met à jour ensuite.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # GITHUB_TOKEN est fourni automatiquement par GitHub — pas à créer
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report

      # Bonus : affiche l'URL Allure en haut de la page du run GHA
      - name: Add report URL to summary
        run: |
          echo "## 📊 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Voir le rapport : https://zotomatise.github.io/playwright-partie-2/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Mis à jour automatiquement à chaque run._" >> $GITHUB_STEP_SUMMARY

  # ALLURE DEPLOY (vrai dashboard Allure) — sous-dossier /allure/
  # Cohabite avec le rapport HTML déjà servi à la racine de gh-pages.
  allure-deploy-real:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Java 17 LTS — Allure CLI tourne sur la JVM
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Install Allure CLI via npm (wrapper qui gère le binaire automatiquement)
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # Génère le site Allure statique dans ./allure-report
      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      # Push sur gh-pages dans le sous-dossier /allure (cohabitation)
      - name: Deploy Allure to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure # 🆕 sous-dossier dédié

      # Bonus : URL Allure dans le résumé du run
      - name: Add Allure URL to summary
        run: |
          echo "## Allure Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Voir : https://zotomatise.github.io/playwright-partie-2/allure/" >> $GITHUB_STEP_SUMMARY
