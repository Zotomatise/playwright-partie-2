name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke API tests
        env:
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
        run: npx playwright test --project=smoke-api

      # SMOKE CHROME (E2E UI) — login UI via global-setup
      # Les credentials de test viennent des GitHub Secrets (M9.L3).
      - name: Run smoke E2E tests (Chrome)
        env:
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
          ZOTOSHOP_TEST_EMAIL: ${{ secrets.ZOTOSHOP_TEST_EMAIL }}
          ZOTOSHOP_TEST_PASSWORD: ${{ secrets.ZOTOSHOP_TEST_PASSWORD }}
        run: npx playwright test --project=smoke-chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  allure-deploy:
    # On déploie même si des tests ont échoué (sinon on ne verrait jamais les rapports rouges)
    if: always()
    # On attend que le job test (smoke-api + smoke-chrome) soit fini
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Droits d'écriture nécessaires pour pousser sur la branche gh-pages
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Récupère le rapport Playwright uploadé en fin de job test (M9.L1)
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      # Lance "allure generate" et produit le site statique dans ./allure-report
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: allure-results
          allure_report: allure-report
      # Pousse le dossier allure-report sur la branche gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # GITHUB_TOKEN est fourni automatiquement par GitHub — pas à créer
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
