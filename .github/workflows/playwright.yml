name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke API tests
        env:
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
        run: npx playwright test --project=smoke-api

      # SMOKE CHROME (E2E UI) — login UI via global-setup
      # Les credentials de test viennent des GitHub Secrets (M9.L3).
      - name: Run smoke E2E tests (Chrome)
        env:
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
          ZOTOSHOP_API_URL: https://api.zotomatise.com
          ZOTOSHOP_PUBLISHABLE_KEY: pk_0ab41d879415264941a92a80aceb00b1b03b93128c7bfaa08f06ae56eda41233
          ZOTOSHOP_TEST_EMAIL: ${{ secrets.ZOTOSHOP_TEST_EMAIL }}
          ZOTOSHOP_TEST_PASSWORD: ${{ secrets.ZOTOSHOP_TEST_PASSWORD }}
        run: npx playwright test --project=smoke-chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
